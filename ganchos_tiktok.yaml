# Ganchos para las versiones de TikTok de los reels (gancho_tiktok.py).
#
# Los 3 primeros segundos de cada reel se cambian por fotos reales de la bici
# con una frase grande; luego sigue el reel normal con su voz y su música.
#   texto:    la frase gancho (las palabras entre *asteriscos* salen en turquesa)
#   planos:   2 fotos de contenido/ (recorte opcional: izquierda, arriba, derecha, abajo)
# Variar las fotos y los recortes: que dos vídeos seguidos no empiecen igual.

ganchos:
  legal:
    duracion: 3
    texto: ¿Tu fatbike es *legal…* o *trucada?*
    planos:
      - foto: v8-real-1.jpg
      - foto: v8-real-1.jpg
        recorte: [600, 400, 1080, 760]
  ficha:
    duracion: 3
    texto: Esta fatbike en *4 cifras*
    planos:
      - foto: v8-lado.jpg
      - foto: v8-lado.jpg
        recorte: [620, 380, 1020, 680]
  patinete:
    duracion: 3
    texto: "*¿Fatbike* o *patinete?*"
    planos:
      - foto: v8-trasera.jpg
        recorte: [60, 650, 900, 1300]
      - foto: v8-lado.jpg
  bateria:
    duracion: 3
    texto: Haz esto y tu batería *durará años*
    planos:
      - foto: v8-lado.jpg
        recorte: [560, 330, 1060, 705]
      - foto: v8-trasera.jpg
  carga:
    duracion: 3
    texto: ¿Cuánto cuesta *cargarla?*
    planos:
      - foto: v8-real-1.jpg
      - foto: v8-real-1.jpg
        recorte: [560, 20, 1000, 350]
  padres:
    duracion: 3
    texto: "*Padres:* ojo antes de regalar una fatbike"
    planos:
      - foto: v8-trasera.jpg
      - foto: v8-lado.jpg
        recorte: [860, 480, 1300, 810]
