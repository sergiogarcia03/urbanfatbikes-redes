name: Publicar en redes

on:
  # Revisa el calendario dos veces por hora. GitHub suele arrancar las tareas
  # programadas 15-25 minutos tarde: la de "y 35" recoge lo de las y media
  # (carruseles 13:30) y la de "y 5" lo de las en punto (reels 19:00).
  schedule:
    - cron: "5 * * * *"
    - cron: "35 * * * *"
  # Cuando se sube una foto nueva, prepara su copia adaptada para Instagram.
  push:
    branches: [main]
    paths:
      - "contenido/**"
      - "!contenido/instagram/**"
      - "tarjetas.yaml"
      - "historias.yaml"
      - "calendario.yaml"
  # Permite lanzarlo a mano desde la pestaña "Actions" de GitHub.
  workflow_dispatch:
    inputs:
      modo:
        description: "comprobar = probar el token · simular = revisar sin publicar · publicar = publicar de verdad"
        type: choice
        options: [comprobar, simular, publicar]
        default: comprobar

permissions:
  contents: write
  issues: write  # avisos de TikTok con el texto para pegar

# Nunca dos ejecuciones a la vez (evita publicar algo dos veces).
concurrency: publicar

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preparar tarjetas y fotos para Instagram
        run: |
          python tarjetas.py
          python reels.py
          python adaptar.py
          python historias.py
          git add contenido
          git diff --cached --quiet || (git commit -m "Preparar tarjetas y fotos para Instagram" && git pull --rebase && git push)
          # Instagram descargará las fotos de esta versión exacta del repositorio.
          echo "VERSION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publicar
        if: github.event_name != 'push'
        run: python publicar.py --modo "${{ inputs.modo || 'publicar' }}" ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Dirección pública de los archivos. Si no se configura la variable
          # MEDIA_BASE_URL, se usan los archivos del propio repositorio
          # (solo funciona si el repositorio es público).
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || format('https://raw.githubusercontent.com/{0}/{1}', github.repository, env.VERSION) }}

      - name: Subir reels a TikTok (como borrador)
        if: always() && github.event_name != 'push'
        run: python tiktok.py --modo ${{ inputs.modo == 'publicar' && 'subir' || inputs.modo == 'simular' && 'simular' || github.event_name == 'schedule' && 'subir' || 'simular' }} ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Guardar qué se ha publicado
        if: always() && github.event_name != 'push'
        run: |
          git add publicados.json
          git diff --cached --quiet || (git commit -m "Registrar publicaciones" && git pull --rebase && git push)
