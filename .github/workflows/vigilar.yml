name: Vigilar el calendario

# GitHub se salta a menudo las tareas programadas (a veces 5-8 horas seguidas).
# Esta tarea se queda esperando y lanza «Publicar en redes» a la hora exacta de lo
# próximo del calendario; al terminar se vuelve a lanzar (relevo). El cron solo
# sirve para arrancar la cadena si alguna vez se corta.
on:
  schedule:
    - cron: "50 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # para lanzar «Publicar en redes» y el relevo

concurrency: vigilar

jobs:
  vigilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python vigilar.py
        env:
          GH_TOKEN: ${{ github.token }}
