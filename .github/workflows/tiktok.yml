name: Conectar TikTok

# Se lanza a mano desde la pestaña "Actions" de GitHub.
# Los reels se suben solos a TikTok desde el workflow "Publicar en redes".
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "enlace = dar permiso · conectar = pegar el código · comprobar = probar la conexión · probar = mandar un reel de prueba · simular = ver qué subiría · subir = subir ya"
        type: choice
        options: [enlace, conectar, comprobar, probar, estado, simular, subir]
        default: enlace
      codigo:
        description: "Solo para conectar: el código que te da la web después de dar permiso"
        required: false
      publish_id:
        description: "Solo para estado: identificadores de subidas anteriores, separados por comas"
        required: false

permissions:
  contents: write
  issues: write

# Comparte turno con "Publicar en redes" para no pisarse al guardar publicados.json.
concurrency: publicar

jobs:
  tiktok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: TikTok
        run: python tiktok.py --modo "${{ inputs.modo }}" --manual
        env:
          TIKTOK_CODIGO: ${{ inputs.codigo }}
          TIKTOK_PUBLISH_ID: ${{ inputs.publish_id }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Guardar qué se ha subido
        if: always() && inputs.modo == 'subir'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicados.json
          git diff --cached --quiet || (git commit -m "Registrar subidas a TikTok" && git pull --rebase && git push)
