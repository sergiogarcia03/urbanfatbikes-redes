      ¿Vas a regalarle una fatbike eléctrica a tu hijo? Revisa esto antes 👇

      1. Pide el informe de ensayo según la norma europea EN 15194.
      2. Que no tenga acelerador: si empuja sin pedalear por encima de 6 km/h, ya no es una bicicleta.
      3. Nada de "modos desbloqueados" que pasen de 25 km/h.

      Y siempre casco: para menores de 16 años es obligatorio en cualquier vía.

      Compártelo con quien lo necesite.

      #urbanfatbikes #fatbike #bicicletaelectrica #seguridadvial #padres

