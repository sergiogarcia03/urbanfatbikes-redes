      ¿Necesitas carné para llevar una fatbike? Y otros 3 mitos que casi todo el mundo se cree 👇

      1. Todas son ilegales → Falso, si cumplen la norma EN 15194.
      2. Necesitas carné y seguro → Falso, si es una bicicleta eléctrica que cumple la norma.
      3. Con acelerador, la velocidad da igual → Falso, por encima de 6 km/h sin pedalear pasa a ser un vehículo de motor (L1e).
      4. El casco nunca es obligatorio → Falso, para menores de 16 años y en vías interurbanas.

      ¿Conocías los 4? Te leemos en comentarios.

      #urbanfatbikes #fatbike #fatbikeelectrica #bicicletaelectrica #EN15194

