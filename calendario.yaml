    texto: |
      Presentamos urbanfatbikes.

      Fatbikes eléctricas ensayadas según la norma europea EN 15194, para moverte por la ciudad con comodidad, seguridad y sin complicaciones legales.

      Estamos preparando el lanzamiento en España. Mientras tanto, aquí te contaremos todo lo que conviene saber antes de elegir una fatbike: modelos, normativa, mantenimiento y uso seguro.

      Síguenos para no perderte nada.

      #urbanfatbikes #fatbike #fatbikeelectrica #bicicletaelectrica #movilidadurbana

  - id: reel-legal
    fecha: "2026-10-07 19:00"
    archivos:
      - reel-legal-tiktok.mp4  # ya publicado el 07/10 (la versión rápida es rapido-legal.mp4)
    texto: |
      ¿Tu fatbike es legal? Estas 3 cifras lo deciden 👇

      En España, una fatbike eléctrica cuenta como bicicleta si cumple la norma EN 15194: asistencia hasta 25 km/h, motor de 250 W y ayuda solo al pedalear (salvo la asistencia de arranque, hasta 6 km/h).

      Si supera alguna, deja de ser una bicicleta: pasa a ser un vehículo de motor (categoría L1e) y necesita homologación, matrícula, seguro y permiso AM.

      Antes de comprar, pide siempre el certificado. Mándaselo a quien esté pensando en comprarse una.

      #urbanfatbikes #fatbike #bicicletaelectrica #normativa #DGT

