# Calendario de publicaciones de urbanfatbikes
#
# Cada publicación lleva:
#   id:       un nombre único, sin espacios (sirve para no publicarla dos veces)
#   fecha:    cuándo publicarla, en hora de España: "AAAA-MM-DD HH:MM"
#   archivos: uno o varios archivos de la carpeta contenido/
#               - 1 foto (.jpg)      -> publicación normal
#               - 1 vídeo (.mp4)     -> reel
#               - de 2 a 10 archivos -> carrusel
#   texto:    el texto de la publicación, con sus hashtags
#   borrador: (opcional) sí = todavía no se publica
#
# El programa revisa el calendario cada hora, así que la publicación sale
# en la primera revisión después de la fecha indicada (puede tardar hasta 1 hora).
# Si una fecha pasó hace más de 24 horas sin publicarse, no sale sola:
# hay que ponerle una fecha nueva.
#
# Ejemplo (quita las almohadillas # del principio para activarlo):
#
#  - id: primera-prueba
#    fecha: "2026-10-01 18:30"
#    archivos:
#      - primera-prueba.jpg
#    texto: |
#      ¡Hola desde urbanfatbikes! 🚲
#      #fatbike #ebike #urbanfatbikes

publicaciones:

  - id: presentacion
    fecha: "2026-10-05 19:00"
    archivos:
      - tarjeta-presentacion-1.jpg
    texto: |
      Presentamos urbanfatbikes.

      Fatbikes eléctricas certificadas para moverte por la ciudad con comodidad, seguridad y sin complicaciones legales.

      Estamos preparando el lanzamiento en España. Mientras tanto, aquí te contaremos todo lo que conviene saber antes de elegir una fatbike: modelos, normativa, mantenimiento y uso seguro.

      Síguenos para no perderte nada.

      #urbanfatbikes #fatbike #fatbikeelectrica #bicicletaelectrica #movilidadurbana #ebike

  - id: reel-legal
    fecha: "2026-10-07 19:00"
    archivos:
      - reel-legal.mp4
    texto: |
      ¿Tu fatbike es legal? Estas 3 cifras lo deciden 👇

      En España, una fatbike eléctrica cuenta como bicicleta si cumple la norma EN 15194: asistencia hasta 25 km/h, motor de 250 W y ayuda solo al pedalear (salvo la asistencia de arranque, hasta 6 km/h).

      Si supera alguna, legalmente es un ciclomotor: homologación, matrícula, seguro y carné.

      Antes de comprar, pide siempre el certificado. Guarda este vídeo y compártelo con quien esté pensando en comprarse una.

      #urbanfatbikes #fatbike #bicicletaelectrica #normativa #DGT #movilidadurbana

