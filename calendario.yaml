    texto: |
      Black Friday: 3 trampas al comprar una fatbike barata ⚠️

      1. «500 W» o «45 km/h»: ya no es una bicicleta, es un vehículo de motor (L1e).
      2. Sin informe de ensayo según la norma EN 15194, no te fíes.
      3. «Modo desbloqueable»: si pasa de 25 km/h, en la calle es ilegal.
      Busca 250 W, asistencia hasta 25 km/h y acelerador hasta 6 km/h.

      Mándaselo a quien esté mirando una.

