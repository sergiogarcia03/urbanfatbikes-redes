# Tarjetas con el diseño de urbanfatbikes.
#
# El programa tarjetas.py convierte cada diapositiva en una imagen
# contenido/tarjeta-<nombre>-<número>.jpg, que luego se usa en calendario.yaml.
# Varias diapositivas = carrusel para deslizar.
#
# Tipos de diapositiva:
#   portada: titular grande (antetitulo, titulo, subtitulo) y opcionalmente
#            una foto de producto sin fondo (imagen) o el logo (logo: sí)
#   dato:    una cifra gigante (numero, unidad, texto)
#   lista:   un título con varios puntos (titulo, puntos, nota)
#   cierre:  logo grande con una frase final (titulo, texto)
#
# Las palabras entre *asteriscos* salen en turquesa.
# "dice" es la frase del guion que se oye en esa diapositiva (para los reels con voz).
#
# Con "reel: sí", además se crea un vídeo animado contenido/reel-<nombre>.mp4
# (ver reels.py). Con "musica: archivo.mp3" lleva ese audio de contenido/musica/.

tarjetas:
  - nombre: presentacion
    diapositivas:
      - tipo: portada
        antetitulo: Próximamente en España
        titulo: Fatbikes eléctricas. *Legales.*
        subtitulo: Ensayadas según la norma europea EN 15194.
        logo: sí

  - nombre: legal
    reel: sí
    musica: urban-1.m4a
    voz: [legal-1.aac, legal-2.aac]
    diapositivas:
      - tipo: portada
        antetitulo: Antes de comprar
        titulo: ¿Tu fatbike es *legal?*
        subtitulo: 3 cifras deciden si es una bicicleta o un vehículo de motor.
        tamano: 130
        dice: ¿Tu fatbike eléctrica es legal? Hay tres cifras que lo deciden.
      - tipo: dato
        antetitulo: Cifra 1
        numero: 25
        unidad: km/h
        texto: A esta velocidad el motor deja de ayudarte. Si sigue empujando, no es una bicicleta.
        dice: Uno, veinticinco kilómetros por hora. A esa velocidad, el motor tiene que dejar de ayudarte.
      - tipo: dato
        antetitulo: Cifra 2
        numero: 250
        unidad: vatios
        texto: Es la potencia nominal máxima del motor de una bicicleta eléctrica.
        dice: Dos, doscientos cincuenta vatios de potencia, como máximo.
      - tipo: dato
        antetitulo: Cifra 3
        numero: 6
        unidad: km/h sin pedalear
        texto: Es lo máximo que puede ayudarte al arrancar. Por encima, el motor solo funciona si pedaleas.
        dice: Tres, sin pedalear, solo puede ayudarte hasta seis kilómetros por hora, para arrancar.
      - tipo: lista
        titulo: ¿Supera alguna? *Ya no es una bici*
        puntos:
          - Pasa a ser un vehículo de motor (L1e)
          - Homologación y matrícula
          - Seguro obligatorio y permiso AM
        dice: Si supera alguna, legalmente es un ciclomotor. Necesita homologación, matrícula, seguro y carné.
      - tipo: cierre
        titulo: Pide siempre el certificado *EN 15194*
        texto: Síguenos para saber más antes de elegir tu fatbike.
        dice: Así que antes de comprar, pide siempre el certificado. Síguenos para saber más.

  # Usa la foto del proveedor: solo se publica cuando haya permiso.
  - nombre: v8
    diapositivas:
      - tipo: portada
        antetitulo: Te presentamos
        titulo: La nueva *V8*
        subtitulo: Estética clásica. Ruedas de 4 pulgadas. 100 % bicicleta.
        imagen: v8-estudio.webp

  - nombre: incluye
    reel: sí
    musica: urban-2.m4a
    diapositivas:
      - tipo: dato
        antetitulo: Qué incluye tu V8
        numero: 3
        unidad: regalos con cada bici
        texto: Para que salgas a rodar desde el primer día.
      - tipo: lista
        titulo: De *regalo*
        puntos:
          - Candado
          - Bomba de aire
          - Kit de herramientas
      - tipo: lista
        titulo: Y de *serie*
        puntos:
          - Llave NFC y alarma
          - Localizador compatible con iPhone
          - Frenos de disco hidráulicos
          - Doble suspensión
      - tipo: cierre
        titulo: ¿Qué te parece?
        texto: Cuéntanoslo en comentarios.

  - nombre: ficha
    reel: sí
    musica: urban-2.m4a
    voz: [ficha.aac]
    diapositivas:
      - tipo: portada
        antetitulo: Ficha técnica
        titulo: La *V8* en 4 cifras
        subtitulo: Guárdala para tenerla a mano.
        tamano: 130
        dice: Esta es la V8, en cuatro cifras.
      - tipo: dato
        numero: 250
        unidad: vatios
        texto: Motor con asistencia al pedaleo hasta 25 km/h.
        dice: Doscientos cincuenta vatios de motor, con asistencia hasta veinticinco kilómetros por hora.
      - tipo: dato
        numero: 50-55
        unidad: km de autonomía
        texto: Según fabricante, con batería de litio de 48 V y 15,6 Ah.
        dice: Entre cincuenta y cincuenta y cinco kilómetros de autonomía, según el fabricante.
      - tipo: dato
        numero: 4"
        unidad: de ancho de rueda
        texto: Ruedas de 20" × 4" para más agarre y comodidad en asfalto, tierra o arena.
        dice: Tiene ruedas de cuatro pulgadas de ancho, para ir cómodo por asfalto, tierra o arena.
      - tipo: dato
        numero: 2
        unidad: suspensiones
        texto: Delantera y trasera, con frenos de disco hidráulicos.
        dice: Y doble suspensión, delante y detrás, con frenos de disco hidráulicos.
      - tipo: cierre
        titulo: Ensayada por *TÜV Rheinland*
        texto: Según la norma europea EN 15194.
        dice: Ensayada por Rheinland según la norma europea. Guárdalo para tenerlo a mano.

  - nombre: patinete
    reel: sí
    musica: urban-1.m4a
    voz: [patinete.aac]
    diapositivas:
      - tipo: portada
        antetitulo: Comparativa
        titulo: ¿Fatbike o *patinete* eléctrico?
        subtitulo: Te lo resumimos en 30 segundos.
        tamano: 120
        dice: ¿Fatbike o patinete eléctrico? Te lo resumimos en treinta segundos.
      - tipo: dato
        antetitulo: Estabilidad
        numero: 4"
        unidad: de ancho de rueda
        texto: Mucho más agarre que las ruedas pequeñas de un patinete.
        dice: Estabilidad. Las ruedas de cuatro pulgadas agarran mucho más que las ruedas pequeñas de un patinete.
      - tipo: lista
        titulo: "*Comodidad*"
        puntos:
          - Vas sentado
          - La rueda ancha absorbe baches y adoquines
        dice: Comodidad. Vas sentado y la rueda ancha absorbe baches y adoquines.
      - tipo: lista
        titulo: "*Autonomía*"
        puntos:
          - Suele llegar bastante más lejos con una carga
        dice: Autonomía. Una fatbike suele llegar bastante más lejos con una carga.
      - tipo: portada
        antetitulo: Y lo más importante
        titulo: Si cumple la norma europea, es una *bicicleta*
        dice: Y si cumple la norma europea, legalmente es una bicicleta.
      - tipo: cierre
        titulo: ¿Tú cuál *prefieres?*
        texto: Cuéntanoslo en comentarios.
        dice: ¿Tú cuál prefieres? Cuéntanoslo en comentarios.

  - nombre: que-es
    reel: sí
    musica: urban-1.m4a
    diapositivas:
      - tipo: portada
        antetitulo: Fatbikes
        titulo: ¿Por qué ruedas *tan gordas?*
        subtitulo: Lo que tienes que saber antes de subirte a una.
        tamano: 130
      - tipo: portada
        antetitulo: urbanfatbikes V8
        titulo: Ruedas de *4 pulgadas*
        subtitulo: "Lo que define a una fatbike: neumáticos mucho más anchos que los de una bici normal."
        imagen: v8-estudio.webp
      - tipo: lista
        titulo: Por qué *engancha*
        puntos:
          - Más estabilidad y agarre
          - Más comodidad en baches y adoquines
          - Asfalto, tierra, grava o arena
      - tipo: cierre
        titulo: ¿Te subirías a *una?*
        texto: Cuéntanoslo en comentarios.

  - nombre: bateria
    reel: sí
    musica: tranquila-1.m4a
    voz: [bateria.aac]
    diapositivas:
      - tipo: portada
        antetitulo: Mantenimiento
        titulo: 3 consejos para que tu *batería* dure años
        tamano: 110
        dice: Tres consejos para que la batería de tu bici eléctrica dure muchos años.
      - tipo: dato
        antetitulo: Consejo 1
        numero: 1
        unidad: Cargador original
        texto: Cárgala siempre con el cargador que viene con la bici.
        dice: Uno. Cárgala siempre con el cargador original.
      - tipo: dato
        antetitulo: Consejo 2
        numero: 2
        unidad: Ni sol ni frío
        texto: Cárgala y guárdala a temperatura ambiente.
        dice: Dos. No la dejes al sol ni con mucho frío. Mejor cárgala y guárdala a temperatura ambiente.
      - tipo: dato
        antetitulo: Consejo 3
        numero: 3
        unidad: A media carga
        texto: Si no vas a usar la bici en semanas, guárdala ni vacía ni al 100 %.
        dice: Tres. Si no vas a usar la bici en semanas, guárdala a media carga, no vacía ni al cien por cien.
      - tipo: cierre
        titulo: "*Guarda* este vídeo"
        texto: Y compártelo con quien tenga una bici eléctrica.
        dice: Es muy importante. Guarda este vídeo y compártelo con quien tenga una bici eléctrica.
  - nombre: carga
    reel: sí
    musica: inspira-2.m4a
    voz: [carga.aac]
    quitar:
      carga.aac: [[15.0, 20.5]]  # primer intento de «con una carga entre…» y «borra esto»
    diapositivas:
      - tipo: portada
        antetitulo: Coche o fatbike
        titulo: ¿Cuánto cuesta *cargarla?*
        subtitulo: Hagamos la cuenta.
        tamano: 130
        dice: ¿Cuánto cuesta cargar una fatbike eléctrica? Hagamos la cuenta.
      - tipo: dato
        numero: 0,75
        unidad: kWh por carga
        texto: Es la energía de una batería de 48 V y 15,6 Ah, como la de la urbanfatbikes V8.
        dice: La batería de la urban fatbike V8 es de cuarenta y ocho voltios y quince coma seis amperios hora. Unos cero coma setenta y cinco kilovatios hora.
      - tipo: dato
        numero: 50-55
        unidad: km por carga
        texto: Autonomía según fabricante.
        dice: Con una carga, entre cincuenta y cincuenta y cinco kilómetros, según el fabricante.
      - tipo: lista
        titulo: Y además, *sin*
        puntos:
          - Gasolina
          - Seguro obligatorio
          - Permiso de conducir
        nota: Si cumple la norma EN 15194, legalmente es una bicicleta.
        dice: Y sin gasolina, sin seguro obligatorio y sin carnet, porque legalmente sigue siendo una bicicleta.
      - tipo: cierre
        titulo: Unos *céntimos* por carga
        texto: Según tu tarifa de luz. Guarda este vídeo.
        dice: Así que cargala cuesta 9 céntimos según tu tarifa. Y guarda este vídeo y compártelo con tus amigos.
  - nombre: mitos
    reel: sí
    musica: inspira-2.m4a
    diapositivas:
      - tipo: portada
        antetitulo: Mitos
        titulo: ¿Necesitas *carné* para una fatbike?
        subtitulo: Y otros 3 mitos que casi todo el mundo se cree.
        tamano: 120
      - tipo: portada
        antetitulo: Mito 1
        titulo: Todas son *ilegales*
        subtitulo: Falso. Si cumple la norma EN 15194, legalmente es una bicicleta.
        tamano: 120
      - tipo: portada
        antetitulo: Mito 2
        titulo: Necesitas *carné* y seguro
        subtitulo: Falso. Una bicicleta eléctrica que cumple la norma no necesita permiso de conducir ni seguro obligatorio.
        tamano: 110
      - tipo: portada
        antetitulo: Mito 3
        titulo: Con *acelerador,* la velocidad da igual
        subtitulo: Falso. Si el motor empuja sin pedalear por encima de 6 km/h, pasa a ser un vehículo de motor (L1e).
        tamano: 110
      - tipo: portada
        antetitulo: Mito 4
        titulo: El casco *nunca* es obligatorio
        subtitulo: Falso. Lo es para menores de 16 años y, para todos, en vías interurbanas.
        tamano: 100
      - tipo: cierre
        titulo: ¿Conocías *los 4?*
        texto: Cuéntanoslo en comentarios.
  - nombre: padres
    reel: sí
    musica: tranquila-1.m4a
    voz: [padres.aac]
    limpieza: fuerte  # quita más ruido de fondo de esta grabación
    diapositivas:
      - tipo: portada
        antetitulo: Para padres
        titulo: ¿Vas a regalarle una *fatbike?*
        subtitulo: Revisa estas 3 cosas antes.
        tamano: 110
        dice: Vas a regalarle una fat bike eléctrica a tu hijo, que deberías saber antes de comprar una.
      - tipo: dato
        antetitulo: Paso 1
        numero: 1
        unidad: El informe de ensayo
        texto: Pide el informe según la norma europea EN 15194. Sin él, no sabes si es una bicicleta.
        dice: Primero, pide el informe de ensayo, según la norma europea, EN 15194.
      - tipo: dato
        antetitulo: Paso 2
        numero: 2
        unidad: Sin acelerador
        texto: Si el motor empuja sin pedalear por encima de 6 km/h, ya no es una bicicleta.
        dice: Segundo, que no tenga acelerador. Se empuja sin pedalar por encima de seis kilómetros por hora, ya no es una bicicleta.
      - tipo: dato
        antetitulo: Paso 3
        numero: 3
        unidad: Sin trucos
        texto: Desconfía de los "modos desbloqueados" que pasan de 25 km/h.
        dice: Y tercero, nada de modos de bloqueados que pasen de 25 km por hora.
      - tipo: lista
        titulo: Y siempre, *casco*
        puntos:
          - Obligatorio para menores de 16 años
          - En cualquier vía
        dice: Siempre hay que llevar el casco para menores de 16 años en cualquier vía.
      - tipo: cierre
        titulo: Compártelo con quien lo *necesite*
        texto: Síguenos para elegir bien.
        dice: Comparte este vídeo con quien lo necesite.
