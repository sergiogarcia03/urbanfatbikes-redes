# Reels rápidos (reels_rapidos.py): un golpe nuevo cada 2 tiempos de la música.
#
# Cada golpe:
#   estilo:   neon|aviso|claro|caja (del reel o de un golpe): que no todos tengan la misma base
#   fondo:    {foto: archivo, recorte: [x1, y1, x2, y2], zoom: in|out}
#             {escena: sofa|aeropuerto|holanda|comparar|bici|mapa|final, desde: s}  (dibujos de «Mi historia»)
#             {icono: velocimetro|multa|auriculares|movil|cerveza|luces|matricula|bateria|enchufe|cebra|ruedas|silla, valor: ...}
#             {video: faro|frontal|manillar|pantalla|suspension}   (tomas del proveedor sin rótulos)
#             {color: oscuro|turquesa|rojo}
#   texto:    frase corta (las palabras entre *asteriscos* en turquesa); entra palabra a palabra
#   numero:   cifra gigante encima del texto
#   pegatina: si | no   (✅ / ❌)
#   avatar:   {pose: pie|senala|brazos|duda|niega, cara: normal|sorpresa|sonrie|serio, lado: derecha|izquierda}
#   tiempos:  cuántos tiempos dura (2 por defecto)
# Reglas: 5-6 s (5 golpes), sin más de un fondo liso por reel, gancho en el primer golpe, nunca dos golpes iguales seguidos, cerrar con una sola petición.

reels:
  legal:
    musica: urban-1
    golpes:
    - fondo:
        foto: v8-estudio.webp
        recorte:
        - 120
        - 150
        - 1900
        - 1900
      texto: ¿Tu fatbike es *legal…*
      avatar:
        pose: duda
        cara: sorpresa
        lado: derecha
    - fondo:
        video: faro
      texto: …o *trucada?*
    - fondo:
        color: turquesa
      numero: 250 W
      texto: de potencia, *como máximo*
    - fondo:
        foto: v8-estudio.webp
        recorte:
        - 180
        - 980
        - 940
        - 1800
      numero: '25'
      texto: km/h y el motor *se para*
    - fondo:
        video: manillar
      numero: '6'
      texto: km/h *sin pedalear*
    - fondo:
        color: rojo
      texto: ¿Supera *alguna?*
      avatar:
        pose: niega
        cara: serio
        lado: izquierda
    - fondo:
        color: rojo
      texto: Es un *vehículo de motor*
      pegatina: 'no'
    - fondo:
        video: suspension
      texto: Matrícula, seguro y *carné*
    - fondo:
        foto: v8-estudio.webp
        recorte:
        - 120
        - 150
        - 1900
        - 1900
        zoom: out
      texto: Pide el informe *EN 15194*
      pegatina: si
    - fondo:
        color: turquesa
      texto: '*Mándaselo* a quien vaya a comprarse una'
      avatar:
        pose: brazos
        cara: sonrie
        lado: derecha
  ek30:
    musica: urban-2
    golpes:
    - fondo:
        color: oscuro
      texto: ¿La EverCross EK30 es *legal?*
      avatar:
        pose: duda
        cara: sorpresa
        lado: derecha
    - fondo:
        color: turquesa
      texto: Miramos su *ficha*
      avatar:
        pose: senala
        cara: normal
        lado: izquierda
    - fondo:
        color: oscuro
      numero: 250 W
      texto: de motor
      pegatina: si
    - fondo:
        color: turquesa
      numero: '25'
      texto: km/h de velocidad máxima
      pegatina: si
    - fondo:
        color: rojo
      texto: Ruedas de 20 x *4 pulgadas*
    - fondo:
        color: oscuro
      texto: Sobre el papel, cifras de *bicicleta*
      avatar:
        pose: brazos
        cara: sonrie
        lado: derecha
    - fondo:
        color: rojo
      texto: Pero pide siempre el informe *EN 15194*
    - fondo:
        color: turquesa
      texto: ¿Cuál quieres que *miremos ahora?*

  detalles:
    musica: inspira-1
    estilo: neon
    golpes:
      - fondo: {video: faro}
        texto: Faro *LED,* llave NFC y alarma
      - fondo: {video: pantalla}
        texto: Pantalla con *velocidad*
      - fondo: {video: manillar}
        texto: Mandos en el *manillar*
      - fondo: {video: suspension}
        texto: Doble *suspensión*
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900], zoom: out}
        texto: ¿Cuál es tu *favorito?*
        avatar: {pose: senala, cara: sonrie, lado: izquierda}

  ficha:
    musica: urban-2
    estilo: caja
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: Esta fatbike en *4 cifras*
        avatar: {pose: senala, cara: sonrie, lado: derecha}
      - fondo: {icono: velocimetro, valor: 25}
        texto: "*250 W* y hasta 25 km/h"
      - fondo: {icono: bateria}
        texto: 50-55 km *según fabricante*
      - fondo: {foto: v8-estudio.webp, recorte: [180, 980, 940, 1800]}
        texto: Ruedas de *4 pulgadas*
      - fondo: {video: suspension}
        texto: Doble suspensión. *Guárdalo*

  norma-25:
    musica: inspira-1
    estilo: aviso
    golpes:
      - fondo: {icono: velocimetro, valor: 32}
        texto: ¿Tu fatbike pasa de *25 km/h?*
      - fondo: {escena: comparar, desde: 1.5}
        texto: Entonces no es una *bici*
      - fondo: {icono: matricula}
        texto: Es un *vehículo de motor*
      - fondo: {icono: multa, valor: SEGURO, color: rojo}
        texto: Matrícula, seguro y *permiso AM*
      - fondo: {foto: v8-estudio.webp, recorte: [500, 150, 1150, 560]}
        texto: "*Mándaselo* a quien la tenga trucada"

  patinete:
    musica: urban-1
    estilo: claro
    golpes:
      - fondo: {escena: bici, desde: 1.0}
        texto: "*¿Fatbike* o *patinete?*"
        tiempos: 3
      - fondo: {icono: ruedas}
        texto: Ruedas de *4 pulgadas*
        tiempos: 2.5
      - fondo: {foto: v8-estudio.webp, recorte: [180, 980, 940, 1800]}
        texto: Más *estable* en baches y adoquines
        tiempos: 2.5
      - fondo: {foto: v8-estudio.webp, recorte: [1000, 560, 1760, 1000]}
        texto: Vas *sentado*
        pegatina: si
        tiempos: 2.5
      - fondo: {video: suspension}
        texto: "Doble suspensión: *absorbe* los golpes"
        tiempos: 2.5
      - fondo: {icono: bateria}
        texto: Suele llegar *más lejos*
        tiempos: 2.5
      - fondo: {video: frontal}
        texto: Y cesta delantera para *la compra*
        tiempos: 2.5
      - fondo: {escena: comparar, desde: 1.5}
        texto: Si cumple la norma, es una *bicicleta*
        pegatina: si
        tiempos: 3
      - fondo: {color: turquesa}
        texto: ¿Tú cuál *prefieres?*
        avatar: {pose: duda, cara: sonrie, lado: derecha}
        tiempos: 4

  pov-1000w:
    musica: urban-2
    estilo: neon
    progreso: si
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: Solo 1 de estas 3 fatbikes es *legal*
        avatar: {pose: duda, cara: sorpresa, lado: derecha}
        tiempos: 4
      - fondo: {color: rojo}
        marca: 1/3
        texto: Te ayuda hasta *45 km/h*
        quiz: {correcta: 1, cuenta: 2, explica: "Es un *ciclomotor*"}
        tiempos: 8
      - fondo: {foto: v8-estudio.webp, recorte: [430, 420, 900, 860]}
        marca: 2/3
        texto: 250 W y deja de ayudar a *25 km/h*
        quiz: {correcta: 0, cuenta: 2, explica: "Con informe *EN 15194*"}
        tiempos: 8
      - fondo: {color: oscuro}
        marca: 3/3
        texto: Acelerador hasta *30 km/h* sin pedalear
        quiz: {correcta: 1, cuenta: 2, explica: "Vehículo de motor *(L1e)*"}
        tiempos: 8
      - fondo: {color: turquesa}
        texto: ¿Cuántas *acertaste?* Dínoslo en comentarios
        avatar: {pose: senala, cara: sonrie, lado: derecha}
        tiempos: 5

  mitos:
    musica: inspira-2
    estilo: caja
    progreso: si
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: 3 mitos de las fatbikes que *casi todos* se creen
        avatar: {pose: duda, cara: sorpresa, lado: derecha}
        tiempos: 4
      - fondo: {video: frontal}
        marca: 1/3
        texto: Necesitas *carné* para llevarla
        quiz: {opciones: [VERDAD, MENTIRA], correcta: 1, cuenta: 2, explica: "Si cumple la norma, *no*"}
        tiempos: 7
      - fondo: {video: faro}
        marca: 2/3
        texto: Todas las fatbikes son *ilegales*
        quiz: {opciones: [VERDAD, MENTIRA], correcta: 1, cuenta: 2, explica: "250 W y 25 km/h: *es una bici*"}
        tiempos: 7
      - fondo: {video: pantalla}
        marca: 3/3
        texto: Con acelerador, la velocidad *da igual*
        quiz: {opciones: [VERDAD, MENTIRA], correcta: 1, cuenta: 2, explica: "Más de 6 km/h sin pedalear: *L1e*"}
        tiempos: 7
      - fondo: {color: turquesa}
        texto: ¿Cuál *te creías?* Dínoslo en comentarios
        avatar: {pose: senala, cara: sonrie, lado: derecha}
        tiempos: 5

  bateria:
    musica: tranquila-1
    estilo: claro
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [820, 720, 1300, 1300]}
        texto: Haz esto y tu batería *durará años*
      - fondo: {icono: enchufe}
        texto: Siempre el *cargador original*
      - fondo: {icono: luces}
        texto: Ni sol ni *frío*
      - fondo: {icono: bateria, valor: media}
        texto: Sin usarla, a *media carga*
      - fondo: {color: turquesa}
        texto: "*Mándaselo* a quien tenga una bici eléctrica"
        avatar: {pose: senala, cara: sonrie, lado: derecha}

  auriculares:
    musica: inspira-1
    estilo: aviso
    golpes:
      - fondo: {icono: auriculares}
        texto: ¿Auriculares en la *fatbike?*
      - fondo: {icono: multa, valor: "200 €", color: rojo}
        texto: "*200 €* de multa"
      - fondo: {escena: bici, desde: 2.0}
        texto: Aunque no esté *sonando nada*
      - fondo: {icono: movil}
        texto: Y el *móvil,* igual
      - fondo: {video: manillar}
        texto: "*Mándaselo* a quien va con cascos"

  incluye:
    musica: urban-2
    estilo: neon
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: "*3 regalos* con cada fatbike"
        avatar: {pose: brazos, cara: sorpresa, lado: derecha}
        tiempos: 3
      - fondo: {color: turquesa}
        texto: Candado, bomba de aire y *herramientas*
        pegatina: si
        tiempos: 4
      - fondo: {video: manillar}
        texto: Llave *NFC* y alarma
        tiempos: 3
      - fondo: {foto: v8-estudio.webp, recorte: [500, 150, 1150, 560]}
        texto: Localizador para encontrarlo desde *tu móvil*
        tiempos: 4
      - fondo: {video: suspension}
        texto: "*Mándaselo* a quien busca una"
        tiempos: 4

  nino:
    musica: urban-1
    estilo: claro
    golpes:
      - fondo: {icono: silla}
        texto: ¿Tu hijo de paquete en la *fatbike?*
      - fondo: {color: turquesa}
        numero: "7"
        texto: años, *como mucho*
      - fondo: {foto: v8-estudio.webp, recorte: [1000, 560, 1760, 1000]}
        texto: En asiento *homologado*
        pegatina: si
      - fondo: {icono: multa, valor: "100 €", color: rojo}
        texto: Si no, *100 €*
      - fondo: {escena: final, desde: 1.0}
        texto: "*Mándaselo* a quien lleva a sus hijos"

  carga:
    musica: inspira-2
    estilo: caja
    golpes:
      - fondo: {icono: enchufe}
        texto: ¿Cuánto cuesta *cargarla?*
      - fondo: {icono: bateria}
        texto: "*0,75 kWh* por carga"
      - fondo: {video: pantalla}
        texto: 50-55 km *según fabricante*
      - fondo: {escena: bici, desde: 1.5}
        texto: Sin *gasolina* ni carné
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900], zoom: out}
        texto: Unos *céntimos.* Mándaselo
        avatar: {pose: brazos, cara: sonrie, lado: derecha}

  que-es:
    musica: urban-1
    estilo: neon
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [1050, 950, 1850, 1750]}
        texto: ¿Por qué ruedas *tan gordas?*
      - fondo: {icono: ruedas}
        texto: "*4 pulgadas* o más"
      - fondo: {escena: holanda, desde: 1.0}
        texto: Más *estabilidad*
      - fondo: {video: suspension}
        texto: Más *comodidad*
      - fondo: {escena: bici, desde: 2.5}
        texto: ¿Te subirías a *una?*

  alcohol:
    musica: inspira-2
    estilo: aviso
    golpes:
      - fondo: {icono: cerveza}
        texto: ¿Una cerveza y a la *fatbike?*
      - fondo: {escena: bici, desde: 1.0}
        texto: La misma tasa que *en coche*
      - fondo: {color: oscuro}
        numero: "0,25"
        texto: mg/l en aire *espirado*
      - fondo: {icono: multa, valor: "1.000 €", color: rojo}
        texto: De *500 a 1.000 €*
      - fondo: {foto: v8-estudio.webp, recorte: [500, 150, 1150, 560]}
        texto: "*Mándaselo* a quien diga que en bici no pasa nada"

  padres:
    musica: tranquila-1
    estilo: claro
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [1000, 560, 1760, 1000]}
        texto: "*Padres:* ojo antes de regalar una fatbike"
      - fondo: {escena: comparar, desde: 1.5}
        texto: Pide el informe *EN 15194*
      - fondo: {icono: velocimetro, valor: 6}
        texto: Acelerador hasta *6 km/h*
      - fondo: {icono: multa, valor: "+25", color: rojo}
        texto: Ojo con los *modos desbloqueados*
      - fondo: {color: turquesa}
        texto: "*Mándaselo* a quien lo necesite"
        avatar: {pose: senala, cara: serio, lado: derecha}

  luces:
    musica: urban-2
    estilo: neon
    golpes:
      - fondo: {video: faro}
        texto: ¿Fatbike de noche *sin luces?*
      - fondo: {icono: luces}
        texto: Blanca *delante,* roja detrás
      - fondo: {icono: multa, valor: "200 €", color: rojo}
        texto: Sin luces, *200 €*
      - fondo: {escena: holanda, desde: 2.0}
        texto: En interurbanas, *prenda reflectante*
      - fondo: {foto: v8-estudio.webp, recorte: [430, 420, 900, 860]}
        texto: "*Mándaselo* a quien vuelve tarde"

  valencia:
    musica: urban-2
    estilo: caja
    golpes:
      - fondo: {escena: sofa, desde: 1.0}
        texto: ¿Fatbike por la acera en *València?*
      - fondo: {icono: cebra}
        texto: Por la acera, *no*
        pegatina: "no"
      - fondo: {icono: velocimetro, valor: 20}
        texto: "Carril bici en la calzada: *20 km/h*"
      - fondo: {icono: velocimetro, valor: 15, color: turquesa}
        texto: "Sobre la acera: *15 km/h*"
      - fondo: {escena: bici, desde: 1.0}
        texto: "*Mándaselo* a quien va en bici por València"

  paso-cebra:
    musica: inspira-2
    estilo: aviso
    golpes:
      - fondo: {icono: cebra}
        texto: ¿Cruzas el paso de cebra *montado?*
      - fondo: {icono: multa, valor: "200 €", color: rojo}
        texto: "*200 €* de multa"
      - fondo: {escena: final, desde: 1.0}
        texto: "*Bájate* y cruza andando"
      - fondo: {escena: holanda, desde: 1.5}
        texto: O busca un *paso ciclista*
      - fondo: {foto: v8-estudio.webp, recorte: [180, 980, 940, 1800]}
        texto: "*Mándaselo* a quien siempre cruza montado"

  holanda:
    musica: inspira-1
    estilo: neon
    golpes:
      - fondo: {escena: holanda, desde: 1.0}
        texto: En Holanda ya multan por ir en *fatbike*
        tiempos: 3
      - fondo: {icono: multa, valor: "115 €", color: rojo}
        texto: "*115 €* en Enschede"
        tiempos: 3
      - fondo: {icono: ruedas}
        texto: Ruedas de más de *7 cm* y motor
        tiempos: 3
      - fondo: {escena: bici, desde: 1.5}
        texto: Fuera del centro en *horario de tiendas*
        tiempos: 3
      - fondo: {escena: mapa, desde: 2.0}
        texto: ¿Llegará a *España?*
        tiempos: 3
      - fondo: {escena: comparar, desde: 1.5}
        texto: Aquí, si es legal, es una *bici.* ¿Tú qué opinas?
        tiempos: 4

  diferencias:
    musica: urban-2
    estilo: claro
    golpes:
      - fondo: {icono: ruedas}
        texto: Fatbike vs bici normal en *4 segundos*
      - fondo: {foto: v8-estudio.webp, recorte: [180, 980, 940, 1800]}
        texto: Más *agarre*
      - fondo: {video: suspension}
        texto: Más *cómoda*
      - fondo: {escena: bici, desde: 1.0}
        texto: Y con 250 W, sigue siendo *bici*
      - fondo: {color: turquesa}
        texto: ¿Cuál *elegirías?*
        avatar: {pose: duda, cara: sonrie, lado: derecha}

  trucada:
    musica: urban-1
    estilo: aviso
    golpes:
      - fondo: {escena: comparar, desde: 2.5}
        texto: 3 señales de una fatbike *trucada*
      - fondo: {icono: velocimetro, valor: 35}
        texto: Pasa de *25 km/h*
      - fondo: {video: manillar}
        texto: Acelerador de más de *6 km/h*
      - fondo: {icono: multa, valor: "+250 W", color: rojo}
        texto: Más de *250 W*
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: "*Mándaselo* a quien vaya a comprarse una"

  # Segunda respuesta a Xionsan (09/10/2026): en las respuestas, TikTok tapa arriba (pegatina del comentario)
  # y abajo (comentarios): texto en el centro, sin avatar abajo y más despacio.
  ek30-v2:
    musica: urban-2
    estilo: caja
    texto_y: 720
    tiempos: 4
    golpes:
      - fondo: {foto: terceros/ek30.png, tam: 0.6, y: 0.66, suelo: si}
        texto: "EverCross EK30: lo que dice *su ficha*"
        y: 440
      - fondo: {icono: velocimetro, valor: 25}
        texto: Motor de *250 W*
        y: 650
      - fondo: {color: turquesa}
        numero: "25"
        texto: km/h de velocidad *máxima*
        y: 600
      - fondo: {icono: bateria}
        texto: Batería de *48 V* y 15,6 Ah
        y: 650
      - fondo: {icono: ruedas}
        texto: Ruedas de 20 x *4 pulgadas*
        y: 650
      - fondo: {color: rojo}
        texto: "Ojo: en otra tienda aparece con *500 W*"
        y: 600
        avatar: {pose: duda, cara: sorpresa, lado: derecha}
      - fondo: {icono: matricula}
        texto: Más de 250 W ya es *ciclomotor*
        y: 650
      - fondo: {foto: terceros/ek30.png, tam: 0.6, y: 0.66, suelo: si, zoom: out}
        texto: "Mira la placa del cuadro: *250 W y 25 km/h*"
        y: 440
      - fondo: {icono: velocimetro, valor: 6}
        texto: Sin pedalear, el acelerador hasta *6 km/h*
        y: 650
      - fondo: {color: turquesa}
        texto: Pide la declaración CE y el informe *EN 15194*
        y: 600
        avatar: {pose: senala, cara: sonrie, lado: izquierda}
      - fondo: {color: oscuro}
        texto: Si cumple todo, es una *bici legal*
        y: 600
        pegatina: si

  # --- Semana del 9 al 13 de noviembre de 2026 ---
  pegatina:
    musica: inspira-1
    estilo: claro
    golpes:
      - fondo: {foto: v8-estudio.webp}
        texto: ¿Se te ha despegado la *pegatina* de tu fatbike?
        avatar: {pose: duda, cara: sorpresa, lado: derecha}
      - fondo: {color: oscuro}
        texto: Pide a la tienda la *declaración CE*
        avatar: {pose: senala, cara: sonrie, lado: derecha}
      - fondo: {color: turquesa}
        texto: Y el informe *EN 15194* en PDF
        pegatina: si
      - fondo: {escena: bici, desde: 1.0}
        texto: Guarda la *factura* y el manual
      - fondo: {video: pantalla}
        texto: "*Mándaselo* a quien tenga fatbike"

  seguro:
    musica: urban-2
    estilo: aviso
    golpes:
      - fondo: {escena: sofa, desde: 1.0}
        texto: ¿Tu bici eléctrica necesita *seguro* en 2026?
      - fondo: {foto: v8-estudio.webp}
        texto: "Con 250 W y 25 km/h: *no*"
        pegatina: si
      - fondo: {color: rojo}
        texto: "Patinete eléctrico: *sí,* desde enero de 2026"
      - fondo: {icono: matricula}
        texto: "Trucada: seguro, matrícula y *carné*"
        pegatina: "no"
      - fondo: {video: suspension}
