# Reels rápidos (reels_rapidos.py): un golpe nuevo cada 2 tiempos de la música.
#
# Cada golpe:
#   fondo:    {foto: archivo, recorte: [x1, y1, x2, y2], zoom: in|out}
#             {video: faro|frontal|manillar|pantalla|suspension}   (tomas del proveedor sin rótulos)
#             {color: oscuro|turquesa|rojo}
#   texto:    frase corta (las palabras entre *asteriscos* en turquesa); entra palabra a palabra
#   numero:   cifra gigante encima del texto
#   pegatina: si | no   (✅ / ❌)
#   avatar:   {pose: pie|senala|brazos|duda|niega, cara: normal|sorpresa|sonrie|serio, lado: derecha|izquierda}
#   tiempos:  cuántos tiempos dura (2 por defecto)
# Reglas: 8-12 s, gancho en el primer golpe, nunca dos golpes iguales seguidos, cerrar con una sola petición.

reels:
  legal:
    musica: urban-1
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: ¿Tu fatbike es *legal…*
        avatar: {pose: duda, cara: sorpresa, lado: derecha}
      - fondo: {video: faro}
        texto: …o *trucada?*
      - fondo: {color: turquesa}
        numero: 250 W
        texto: de potencia, *como máximo*
      - fondo: {foto: v8-estudio.webp, recorte: [180, 980, 940, 1800]}
        numero: "25"
        texto: km/h y el motor *se para*
      - fondo: {video: manillar}
        numero: "6"
        texto: km/h *sin pedalear*
      - fondo: {color: rojo}
        texto: ¿Supera *alguna?*
        avatar: {pose: niega, cara: serio, lado: izquierda}
      - fondo: {color: rojo}
        texto: Es un *vehículo de motor*
        pegatina: "no"
      - fondo: {video: suspension}
        texto: Matrícula, seguro y *carné*
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900], zoom: out}
        texto: Pide el informe *EN 15194*
        pegatina: si
      - fondo: {color: turquesa}
        texto: "*Mándaselo* a quien vaya a comprarse una"
        avatar: {pose: brazos, cara: sonrie, lado: derecha}

  detalles:
    musica: inspira-1
    golpes:
      - fondo: {video: faro}
        texto: Lo que *no esperas…*
      - fondo: {video: frontal}
        texto: …en una *fatbike*
        avatar: {pose: duda, cara: sorpresa, lado: derecha}
      - fondo: {video: pantalla}
        texto: Pantalla con *velocidad* y batería
      - fondo: {video: manillar}
        texto: Mandos en el *manillar*
      - fondo: {foto: v8-estudio.webp, recorte: [500, 150, 1150, 560]}
        texto: Llave *NFC* y *alarma*
        pegatina: si
      - fondo: {video: suspension}
        texto: Doble *suspensión*
      - fondo: {foto: v8-estudio.webp, recorte: [820, 720, 1300, 1300]}
        numero: 48 V
        texto: de *batería*
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900], zoom: out}
        texto: La urbanfatbikes *V8*
        avatar: {pose: senala, cara: sonrie, lado: izquierda}
      - fondo: {color: turquesa}
        texto: ¿Cuál es tu *favorito?*

  ficha:
    musica: urban-2
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: Esta fatbike en *4 cifras*
        avatar: {pose: senala, cara: sonrie, lado: derecha}
      - fondo: {color: turquesa}
        numero: 250 W
        texto: de *motor*
      - fondo: {foto: v8-estudio.webp, recorte: [820, 720, 1300, 1300]}
        numero: 50-55
        texto: km de autonomía *según fabricante*
      - fondo: {foto: v8-estudio.webp, recorte: [180, 980, 940, 1800]}
        numero: 4"
        texto: de *rueda*
      - fondo: {video: suspension}
        numero: "2"
        texto: "*suspensiones*"
      - fondo: {video: faro}
        texto: Y faro *LED*
      - fondo: {color: oscuro}
        texto: Ensayada por *TÜV Rheinland*
        pegatina: si
        avatar: {pose: brazos, cara: sonrie, lado: izquierda}
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900], zoom: out}
        texto: según la norma *EN 15194*
      - fondo: {color: turquesa}
        texto: "*Guárdalo* para tenerlo a mano"

  patinete:
    musica: urban-1
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: "*¿Fatbike* o *patinete?*"
        avatar: {pose: duda, cara: sorpresa, lado: derecha}
      - fondo: {foto: v8-estudio.webp, recorte: [180, 980, 940, 1800]}
        numero: 4"
        texto: "de rueda: *más agarre*"
      - fondo: {color: oscuro}
        texto: Ruedas pequeñas en los *baches*
        pegatina: "no"
      - fondo: {foto: v8-estudio.webp, recorte: [1000, 560, 1760, 1000]}
        texto: Vas *sentado*
        pegatina: si
      - fondo: {video: suspension}
        texto: Y la rueda ancha *absorbe* los baches
      - fondo: {foto: v8-estudio.webp, recorte: [820, 720, 1300, 1300]}
        texto: Suele llegar *más lejos* con una carga
      - fondo: {color: turquesa}
        texto: Si cumple la norma, es una *bicicleta*
        avatar: {pose: senala, cara: sonrie, lado: izquierda}
      - fondo: {color: oscuro}
        texto: ¿Tú cuál *prefieres?*

  mitos:
    musica: inspira-2
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: ¿Necesitas *carné* para una fatbike?
        avatar: {pose: duda, cara: sorpresa, lado: derecha}
      - fondo: {color: rojo}
        texto: "Mito: todas son *ilegales*"
        pegatina: "no"
      - fondo: {foto: v8-estudio.webp, recorte: [180, 980, 940, 1800]}
        texto: Con la norma *EN 15194* es una bici
        pegatina: si
      - fondo: {color: rojo}
        texto: "Mito: necesitas *carné* y seguro"
        pegatina: "no"
      - fondo: {video: frontal}
        texto: Si cumple la norma, *no*
      - fondo: {color: rojo}
        texto: "Mito: el *acelerador* da igual"
        pegatina: "no"
      - fondo: {video: manillar}
        numero: "6"
        texto: km/h sin pedalear, *como máximo*
      - fondo: {color: rojo}
        texto: "Mito: el casco *nunca* es obligatorio"
        pegatina: "no"
      - fondo: {color: oscuro}
        texto: Menores de 16 y vías *interurbanas*
        avatar: {pose: senala, cara: serio, lado: izquierda}
      - fondo: {color: turquesa}
        texto: ¿Conocías *los 4?*

  bateria:
    musica: tranquila-1
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [820, 720, 1300, 1300]}
        texto: Haz esto y tu batería *durará años*
        avatar: {pose: senala, cara: sonrie, lado: derecha}
      - fondo: {color: turquesa}
        numero: "1"
        texto: Siempre el *cargador original*
      - fondo: {color: oscuro}
        numero: "2"
        texto: Ni sol *ni frío*
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: Cárgala a *temperatura ambiente*
      - fondo: {color: turquesa}
        numero: "3"
        texto: Si no la usas en semanas…
      - fondo: {video: pantalla}
        texto: …guárdala a *media carga*
        avatar: {pose: brazos, cara: sonrie, lado: izquierda}
      - fondo: {color: oscuro}
        texto: "*Mándaselo* a quien tenga una bici eléctrica"

  incluye:
    musica: urban-2
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        numero: "3"
        texto: regalos con *cada fatbike*
        avatar: {pose: brazos, cara: sorpresa, lado: derecha}
      - fondo: {color: turquesa}
        texto: "*Candado*"
        pegatina: si
      - fondo: {color: oscuro}
        texto: Bomba de *aire*
        pegatina: si
      - fondo: {color: turquesa}
        texto: Kit de *herramientas*
        pegatina: si
      - fondo: {video: manillar}
        texto: "Y de serie: llave *NFC* y alarma"
      - fondo: {foto: v8-estudio.webp, recorte: [500, 150, 1150, 560]}
        texto: Localizador compatible con *iPhone*
      - fondo: {video: suspension}
        texto: Frenos *hidráulicos* y doble suspensión
      - fondo: {color: oscuro}
        texto: "*Mándaselo* a quien esté pensando en comprarse una"
        avatar: {pose: senala, cara: sonrie, lado: izquierda}

  carga:
    musica: inspira-2
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [820, 720, 1300, 1300]}
        texto: ¿Cuánto cuesta *cargarla?*
        avatar: {pose: duda, cara: sorpresa, lado: derecha}
      - fondo: {color: turquesa}
        numero: "0,75"
        texto: kWh por *carga*
      - fondo: {video: pantalla}
        texto: Batería de *48 V* y 15,6 Ah
      - fondo: {color: oscuro}
        numero: 50-55
        texto: km por carga, *según fabricante*
      - fondo: {color: rojo}
        texto: Sin *gasolina*
        pegatina: si
      - fondo: {color: rojo}
        texto: Sin seguro *obligatorio* ni carné
        pegatina: si
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900], zoom: out}
        texto: Unos *céntimos* por carga
        avatar: {pose: brazos, cara: sonrie, lado: izquierda}
      - fondo: {color: turquesa}
        texto: "*Mándaselo* a quien todavía va en coche a todo"

  que-es:
    musica: urban-1
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [1050, 950, 1850, 1750]}
        texto: ¿Por qué ruedas *tan gordas?*
        avatar: {pose: duda, cara: sorpresa, lado: izquierda}
      - fondo: {foto: v8-estudio.webp, recorte: [180, 980, 940, 1800]}
        numero: 4"
        texto: de ancho, *o más*
      - fondo: {color: turquesa}
        texto: Más *estabilidad*
        pegatina: si
      - fondo: {video: suspension}
        texto: Más *comodidad* en baches
      - fondo: {color: oscuro}
        texto: Asfalto, tierra, grava o *arena*
        pegatina: si
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900], zoom: out}
        texto: Por eso *engancha*
        avatar: {pose: brazos, cara: sonrie, lado: derecha}
      - fondo: {color: turquesa}
        texto: ¿Te subirías a *una?*

  padres:
    musica: tranquila-1
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [1000, 560, 1760, 1000]}
        texto: "*Padres:* ojo antes de regalar una fatbike"
        avatar: {pose: senala, cara: serio, lado: derecha}
      - fondo: {color: turquesa}
        numero: "1"
        texto: Pide el informe *EN 15194*
      - fondo: {color: oscuro}
        texto: Sin él, no sabes si es una *bicicleta*
      - fondo: {video: manillar}
        numero: "2"
        texto: Acelerador hasta *6 km/h,* no más
      - fondo: {color: rojo}
        numero: "3"
        texto: Ojo con los *modos desbloqueados*
        pegatina: "no"
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: Y casco, obligatorio para *menores de 16*
        avatar: {pose: brazos, cara: sonrie, lado: izquierda}
      - fondo: {color: turquesa}
        texto: "*Mándaselo* a quien lo necesite"

  valencia:
    musica: urban-2
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: ¿Fatbike por la acera en *València?*
        avatar: {pose: duda, cara: sorpresa, lado: derecha}
      - fondo: {color: rojo}
        texto: Por la acera, *no*
        pegatina: "no"
      - fondo: {video: frontal}
        texto: Las eléctricas de 250 W, *tampoco*
      - fondo: {color: turquesa}
        numero: "20"
        texto: km/h en el carril bici *de la calzada*
      - fondo: {foto: v8-estudio.webp, recorte: [180, 980, 940, 1800]}
        numero: "15"
        texto: km/h si va *sobre la acera*
      - fondo: {color: oscuro}
        texto: Lo dice la Ordenanza de Movilidad de *València*
        avatar: {pose: senala, cara: serio, lado: izquierda}
      - fondo: {color: turquesa}
        texto: "*Mándaselo* a quien vaya en bici por València"

  holanda:
    musica: inspira-1
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        texto: En Holanda ya multan por ir en *fatbike*
        avatar: {pose: niega, cara: sorpresa, lado: derecha}
      - fondo: {color: rojo}
        numero: 115 €
        texto: de multa en *Enschede*
      - fondo: {foto: v8-estudio.webp, recorte: [1050, 950, 1850, 1750]}
        numero: 7 cm
        texto: "de rueda y motor: *fuera del centro*"
      - fondo: {color: oscuro}
        texto: En horario de *tiendas*
      - fondo: {video: frontal}
        texto: ¿Y en *España?*
        avatar: {pose: duda, cara: normal, lado: izquierda}
      - fondo: {color: turquesa}
        texto: Si es legal, es una *bicicleta*
        pegatina: si
      - fondo: {color: rojo}
        texto: Si está trucada, *vehículo de motor*
        pegatina: "no"
      - fondo: {color: oscuro}
        texto: ¿Crees que llegará a *España?*

  trucada:
    musica: urban-1
    golpes:
      - fondo: {foto: v8-estudio.webp, recorte: [120, 150, 1900, 1900]}
        numero: "3"
        texto: señales de una fatbike *trucada*
        avatar: {pose: niega, cara: serio, lado: derecha}
      - fondo: {color: rojo}
        numero: "1"
        texto: El motor ayuda *más allá de 25 km/h*
      - fondo: {video: pantalla}
        texto: En una legal, a 25 km/h *se para*
        pegatina: si
      - fondo: {color: rojo}
        numero: "2"
        texto: El acelerador pasa de *6 km/h*
      - fondo: {video: manillar}
        texto: Sin pedalear, solo *para arrancar*
      - fondo: {color: rojo}
        numero: "3"
        texto: Más de *250 W*
      - fondo: {foto: v8-estudio.webp, recorte: [820, 720, 1300, 1300]}
        texto: 500, 750 o 1.000 W *no es una bici*
        pegatina: "no"
      - fondo: {color: turquesa}
        texto: "*Mándaselo* a quien vaya a comprarse una"
        avatar: {pose: senala, cara: sonrie, lado: izquierda}
